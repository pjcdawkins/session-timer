<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Session Timer — Lead</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Apply a saved theme before first paint (see js/theme.js).
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <script>
    // Before first paint, so the page doesn't flash between the password gate
    // and the controls: with a saved login, show the controls straight away
    // (lead.js checks it once connected and shows the gate if it's refused),
    // and restore Perform mode. Keys match lead.js.
    try {
      if (localStorage.getItem("timer-lead-token") || localStorage.getItem("timer-lead-pw")) document.body.classList.add("signed-in");
      if (localStorage.getItem("timer-lead-perform") === "1") document.body.classList.add("perform");
    } catch {}
  </script>

  <div id="auth-gate">
    <div class="auth-box">
      <h2>Session Lead</h2>
      <form id="auth-form">
        <input type="password" id="password-input" placeholder="Password" autocomplete="off">
        <button type="submit">Enter</button>
      </form>
      <span id="auth-error" class="hidden">Wrong password</span>
    </div>
  </div>

  <div id="qr-modal" class="hidden">
    <div class="qr-box">
      <h2>Scan to Join</h2>
      <div id="qr-svg-container"></div>
      <span id="qr-url-text"></span>
      <button type="button" id="qr-close">Close</button>
    </div>
  </div>

  <div class="app lead-app">
    <div id="status-bar">
      <span class="dot" id="connection-dot"></span>
      <span id="status-text">STOPPED</span>
      <span id="lock-indicator" class="perform-only hidden">Locked</span>
      <span id="screens-summary" class="perform-only">
        <span class="screen-dot"></span>
        <span id="screens-summary-text">No screens</span>
      </span>
    </div>

    <div id="analog-clock"></div>

    <div class="main-display">
      <div id="digital-clock">00:00:00</div>
      <div id="perform-actions" class="perform-only">
        <button type="button" id="btn-perform-start" title="Space">Start</button>
        <button type="button" id="btn-perform-exit" title="Show the controls">Exit perform mode</button>
      </div>
    </div>

    <div id="command-warning" class="hidden" role="alert">Not connected — command not sent</div>

    <div id="controls">
      <div class="transport">
        <button type="button" id="btn-start" title="Space">Start</button>
        <button type="button" id="btn-stop" disabled title="Esc">Pause</button>
        <button type="button" id="btn-reset">Reset</button>
      </div>
      <div class="transport-hints">
        <span>Space = Start</span>
        <label class="lock-toggle">
          <input type="checkbox" id="lock-enabled">
          <span>Show lock</span>
        </label>
        <span>Esc = Pause</span>
      </div>

      <button type="button" id="btn-perform" title="Hide the controls and show the time large (also turns on Show lock)">Perform mode</button>

      <div id="screens-panel">
        <div class="screens-header">
          <span class="screens-label">Screens</span>
          <button type="button" id="btn-screens-clear" title="Forget screens that are no longer connected">Clear lost</button>
        </div>
        <ul id="screens-list"></ul>
        <span id="screens-empty">No screens connected</span>
      </div>

      <fieldset id="lockable" class="lockable">
        <div class="set-time" id="set-time-controls">
          <span class="set-time-label">Set Start Time</span>
          <div class="set-time-inputs">
            <input type="number" id="time-minutes" min="0" max="59" value="0" placeholder="MM" aria-label="Minutes">
            <span>:</span>
            <input type="number" id="time-seconds" min="-59" max="59" value="-5" placeholder="SS" aria-label="Seconds (negative for countdown)">
            <button type="button" id="btn-set-time" aria-label="Set start time">Set</button>
          </div>
        </div>

        <div class="speed-controls">
          <span class="speed-controls-label">Playback Speed</span>
          <div class="speed-presets">
            <button type="button" data-speed="1.00" class="active">1.00x</button>
            <button type="button" data-speed="1.05">1.05x</button>
            <button type="button" data-speed="1.10">1.10x</button>
            <button type="button" data-speed="1.15">1.15x</button>
            <button type="button" data-speed="1.20">1.20x</button>
          </div>
          <div class="speed-custom">
            <input type="number" id="speed-input" min="0.1" max="10" step="0.01" value="1.00">
            <span>x</span>
          </div>
        </div>

        <div class="highlight-controls">
          <label class="highlight-toggle">
            <input type="checkbox" id="highlight-enabled" checked>
            <span>Highlight every</span>
            <input type="number" id="highlight-interval" min="1" max="60" value="10" class="highlight-input">
            <span>sec offset</span>
            <input type="number" id="highlight-offset" min="0" max="59" value="0" class="highlight-input">
          </label>
        </div>
      </fieldset>

      <button type="button" id="btn-qr" class="hidden">Share QR Code</button>

      <button type="button" id="btn-sign-out" title="Sign this screen out (logins otherwise last 24 hours after last use)">Sign out</button>
    </div>

    <div class="corner-footer">
      <div id="speed-display">
        <span id="speed-label">Speed</span>
        <span id="speed-value">1.00x</span>
      </div>

      <div id="real-time">
        <span id="real-time-label">Real time</span>
        <span id="real-time-value">00:00:00</span>
      </div>
    </div>
  </div>

  <script type="module" src="/js/lead.js"></script>
</body>
</html>

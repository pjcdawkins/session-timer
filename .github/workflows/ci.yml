name: CI

on:
  pull_request:
  # Also run as the gate before deploying (see deploy.yml)
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Bundle the Worker exactly as `wrangler deploy` would, without uploading
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: "false"
